services:
  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=livecall
    ports:
      - "5445:5432"
    volumes:
      - ./server/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  server:
    build: ./server
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/livecall
    env_file:
      - ./server/.env
    depends_on:
      - db

  client:
    build: ./client
    ports:
      - "5173:5173"
    environment:
      - VITE_TOKEN_ENDPOINT=http://localhost:8001/api/token
    depends_on:
      - server
